# FinTrack — Docker Compose
# Usage:
#   1. Copy .env.example → .env and set JWT_SECRET
#   2. docker-compose up -d
#   3. Open http://localhost:3001

version: "3.9"

services:
  fintrack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrack
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV:          production
      PORT:              3001
      JWT_SECRET:        ${JWT_SECRET}
      JWT_EXPIRES_IN:    ${JWT_EXPIRES_IN:-30d}
      DB_PATH:           /data/fintrack.db
      PRICE_CACHE_TTL_S: ${PRICE_CACHE_TTL_S:-900}
      BCRYPT_ROUNDS:     ${BCRYPT_ROUNDS:-12}
      CORS_ORIGIN:       ${CORS_ORIGIN:-}
    volumes:
      # Persist the SQLite database across container restarts
      - fintrack_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout:  10s
      retries:  3

volumes:
  fintrack_data:
    driver: local
