# /etc/nginx/sites-available/fintrack
#
# Nginx reverse proxy config for FinTrack on a VPS.
#
# Setup steps:
#   1. Install Nginx: sudo apt install nginx
#   2. Install Certbot: sudo apt install certbot python3-certbot-nginx
#   3. Copy this file to /etc/nginx/sites-available/fintrack
#   4. Replace 'yourapp.com' with your actual domain
#   5. Enable: sudo ln -s /etc/nginx/sites-available/fintrack /etc/nginx/sites-enabled/
#   6. Test: sudo nginx -t
#   7. Get SSL cert: sudo certbot --nginx -d yourapp.com
#   8. Reload: sudo systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name yourapp.com www.yourapp.com;
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name yourapp.com www.yourapp.com;

    # SSL — filled in by certbot automatically
    ssl_certificate     /etc/letsencrypt/live/yourapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourapp.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           DENY                                            always;
    add_header X-Content-Type-Options    nosniff                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;

    # Gzip compression for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Proxy all requests to the FinTrack Node.js server
    location / {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;

        # Allow large payloads (portfolio JSON exports can be a few MB)
        client_max_body_size 10m;
    }

    # Cache static assets at the Nginx layer (index.html should not be cached)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass         http://localhost:3001;
        proxy_cache_bypass $http_upgrade;
        expires            1d;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the app shell or service worker
    location ~ ^/(index\.html|sw\.js|manifest\.json)$ {
        proxy_pass         http://localhost:3001;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
