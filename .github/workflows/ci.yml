# FinTrack — CI/CD Pipeline
# Runs on every push to main and on all PRs
#
# Jobs:
#   test    — lint + basic smoke test
#   deploy  — deploys to Render on push to main (optional, configure secrets)

name: CI/CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Smoke test (server starts up cleanly)
        working-directory: server
        env:
          JWT_SECRET: ci-test-secret-that-is-at-least-32-chars-long
          NODE_ENV: test
          DB_PATH: ./ci-test.db
        run: node -e "require('./index.js'); setTimeout(()=>process.exit(0), 2000);"

      - name: Validate routes exist
        working-directory: server
        run: |
          node -e "require('./routes/auth')"
          node -e "require('./routes/data')"
          node -e "require('./routes/ticker')"
          node -e "require('./db')"
          echo "All modules load successfully"

  # ── Docker build check ────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push — validation only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: fintrack:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy to Render (optional) ───────────────────────────────────────────
  # Uncomment this job and add RENDER_DEPLOY_HOOK_URL to repository secrets
  # to enable automatic deploys on every push to main.
