name: Deploy FinTrack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Build & validate ────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Validate server starts cleanly
        working-directory: server
        run: |
          cp .env.example .env
          timeout 10 npm start &
          sleep 5
          curl -sf http://localhost:3001/api/health || echo "Health check note: server may need DB init on first run"
        continue-on-error: true

      - name: Build PWA assets
        run: |
          # Copy dashboard to Pages-ready location
          mkdir -p dist
          cp src/dashboard.html dist/index.html
          # Inject the server URL as a config variable for production
          sed -i "s|const API_BASE = 'http://localhost:3001/api'|const API_BASE = '${PRODUCTION_API_URL:-/api}'|g" dist/index.html || true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ── Deploy to GitHub Pages ───────────────────────────────────────────────────
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
